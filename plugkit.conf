# comp1's settings for plugkit's check harness (plugkit's README.md, "Per-plugin config"), and the one place
# comp1 pins plugkit (ADR 0007): CMakeLists.txt fetches PLUGKIT_TAG, and CI clones the same tag for the harness.
PLUGKIT_TAG=v0.3.0
PLUGIN_NAME=comp1
PRODUCT_NAME=comp1
VAR_PREFIX=COMP1_
SOURCE_DIRS="engine plugin tests tools"
TESTS_DIR=tests
PLUGIN_DIR=plugin
ENGINE_DIR=engine
# The `docs` stage fails when a range dyn-lab measures over (<NAME>_RANGE in LAB_SCRIPT) differs from the Engine's
# (parameterRanges in LAB_SETTINGS), each spelled as a number or inf. One name per line, so tickets adding ranges in
# parallel merge cleanly: the check splits on any whitespace.
LAB_RANGES="
threshold
ratio
knee
attack
release
hold
range
lookahead
"
LAB_SCRIPT=tools/dyn-lab/dynlab.py
LAB_SETTINGS=engine/include/comp1/Settings.h
SAMPLE_RATES=44100,48000,88200,96000,176400,192000
AU_ID="aufx Cp01 Pmbg"
BUILD_INPUTS=(engine plugin tests cmake plugkit.conf '*CMakeLists.txt')
